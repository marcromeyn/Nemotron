recipe:
  _target_: megatron.bridge.recipes.qwen.qwen3.qwen3_8b_finetune_config
  packed_sequence: true
dataset:
  _target_: megatron.bridge.training.config.FinetuningDatasetConfig
  dataset_root: ${art:data,path}
  seq_length: ${art:data,metadata.pack_size}
  packed_sequence_specs:
    _target_: megatron.bridge.data.datasets.packed_sequence.PackedSequenceSpecs
    packed_sequence_size: ${art:data,metadata.pack_size}
    packed_train_data_path: ${art:data,path}/training.npy
    packed_val_data_path: ${art:data,path}/validation.npy
    packed_metadata_path: ${art:data,path}/metadata.json
train:
  train_iters: 1700
  global_batch_size: 32
scheduler:
  lr_warmup_iters: 32
logger:
  log_interval: 10
  wandb_project: nemotron
  wandb_entity: romeyn
checkpoint:
  save: /nemo_run/sft
  save_interval: 20
  pretrained_checkpoint: ${run.model,pretrain}
run:
  data: DataBlendsArtifact-sft:latest
